<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo List</title>
  </head>
  <body>
    <div class="sidebar">
      <div class="form-section">
        <input
          type="checkbox"
          name="project-form-opener"
          id="project-form-opener"
        />
        <label for="project-form-opener">+</label>
        <form id="project-form">
          <input type="text" name="project-title" id="project-title" />
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
    <header><input type="date" id="date-project-picker" /></header>
    <main></main>
  </body>
</html>
